kind = "web"
previewPath = "/"
title = "منصة البجع للسفر والسياحة"
version = "1.0.0"
id = "artifacts/albaja"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24307

[services.development]
run = "pnpm --filter @workspace/albaja run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/albaja", "run", "build" ]
publicDir = "artifacts/albaja/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24307"
BASE_PATH = "/"
