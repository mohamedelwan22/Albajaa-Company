openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Al-Baja Travel & Tourism ticket management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: tickets
    description: Ticket management
  - name: company
    description: Company settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List all tickets
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create empty ticket (manual entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"

  /tickets/upload:
    post:
      operationId: uploadTicketFile
      tags: [tickets]
      summary: Upload PDF ticket and extract raw text
      responses:
        "200":
          description: Uploaded and extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"

  /tickets/stats:
    get:
      operationId: getTicketStats
      tags: [tickets]
      summary: Get ticket statistics dashboard summary
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketStats"

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get ticket details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /tickets/{id}/generate:
    post:
      operationId: generateTicketPdf
      tags: [tickets]
      summary: Generate branded PDF for ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"

  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get company settings
      responses:
        "200":
          description: Company info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCompany
      tags: [company]
      summary: Update company settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthResult:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required: [success, token, user]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        companyId:
          type: ["string", "null"]
      required: [id, name, email, role]

    Ticket:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        createdBy:
          type: string
        originalFileUrl:
          type: ["string", "null"]
        rawText:
          type: ["string", "null"]
        passengerName:
          type: ["string", "null"]
        ticketNumber:
          type: ["string", "null"]
        bookingReference:
          type: ["string", "null"]
        flightFrom:
          type: ["string", "null"]
        flightTo:
          type: ["string", "null"]
        departureDate:
          type: ["string", "null"]
        departureTime:
          type: ["string", "null"]
        arrivalDate:
          type: ["string", "null"]
        arrivalTime:
          type: ["string", "null"]
        airline:
          type: ["string", "null"]
        flightNumber:
          type: ["string", "null"]
        cabinClass:
          type: ["string", "null"]
        baggageAllowance:
          type: ["string", "null"]
        gate:
          type: ["string", "null"]
        price:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
        issueDate:
          type: ["string", "null"]
        generatedFileUrl:
          type: ["string", "null"]
        hidePrice:
          type: boolean
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        userName:
          type: ["string", "null"]
      required: [id, companyId, createdBy, hidePrice, status, createdAt, updatedAt]

    TicketInput:
      type: object
      properties:
        passengerName:
          type: string

    TicketUpdate:
      type: object
      properties:
        passengerName:
          type: ["string", "null"]
        ticketNumber:
          type: ["string", "null"]
        bookingReference:
          type: ["string", "null"]
        flightFrom:
          type: ["string", "null"]
        flightTo:
          type: ["string", "null"]
        departureDate:
          type: ["string", "null"]
        departureTime:
          type: ["string", "null"]
        arrivalDate:
          type: ["string", "null"]
        arrivalTime:
          type: ["string", "null"]
        airline:
          type: ["string", "null"]
        flightNumber:
          type: ["string", "null"]
        cabinClass:
          type: ["string", "null"]
        baggageAllowance:
          type: ["string", "null"]
        gate:
          type: ["string", "null"]
        price:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
        issueDate:
          type: ["string", "null"]
        hidePrice:
          type: boolean

    TicketResponse:
      type: object
      properties:
        success:
          type: boolean
        ticket:
          $ref: "#/components/schemas/Ticket"
      required: [success, ticket]

    TicketListResponse:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        total:
          type: integer
      required: [tickets, total]

    TicketStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        editing:
          type: integer
        generated:
          type: integer
        sent:
          type: integer
        recentTickets:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
      required: [total, pending, editing, generated, sent, recentTickets]

    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        travelNotes:
          type: ["string", "null"]
      required: [id, name, primaryColor, secondaryColor]

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        travelNotes:
          type: ["string", "null"]
